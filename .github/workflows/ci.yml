name: ClinicGuard checks

on:
  push:
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Python security lint
        run: |
          python -m pip install bandit
          bandit -r tests -q
      - name: Validate Compose configuration
        run: docker compose config
      - name: Start ClinicGuard
        run: docker compose up -d --build
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run policy integration tests
        run: python -m pytest -q ehr_app/test_app.py tests/test_policy.py
      - name: Run attack simulation
        run: docker compose exec -T attacker /attack/attack.sh
      - name: Stop ClinicGuard
        if: always()
        run: docker compose down --remove-orphans
