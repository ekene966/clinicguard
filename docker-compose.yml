name: clinicguard

services:
  gateway:
    build: ./gateway
    depends_on:
      - ehr
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - gateway-logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://10.10.10.254/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      staff:
        ipv4_address: 10.10.10.254
      guest:
        ipv4_address: 10.10.20.254
      server:
        ipv4_address: 10.10.30.254
      management:
        ipv4_address: 10.10.99.254
      attacker:
        ipv4_address: 10.10.66.254

  suricata:
    image: jasonish/suricata:7.0
    network_mode: service:gateway
    depends_on:
      - gateway
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - suricata
      - -i
      - eth0
      - -i
      - eth1
      - -i
      - eth2
      - -i
      - eth3
      - -i
      - eth4
      - -S
      - /rules/local.rules
      - -l
      - /var/log/suricata
    volumes:
      - ./monitoring/suricata:/rules:ro
      - suricata-logs:/var/log/suricata

  staff-client:
    build: ./clients
    cap_add:
      - NET_ADMIN
    command: ["staff"]
    networks:
      staff:
        ipv4_address: 10.10.10.10

  guest-client:
    build: ./clients
    cap_add:
      - NET_ADMIN
    command: ["guest"]
    networks:
      guest:
        ipv4_address: 10.10.20.10

  attacker:
    build: ./clients
    cap_add:
      - NET_ADMIN
    command: ["attacker"]
    volumes:
      - ./attacker:/attack:ro
    networks:
      attacker:
        ipv4_address: 10.10.66.10

  ehr-app:
    build: ./clients
    cap_add:
      - NET_ADMIN
    command: ["server"]
    networks:
      server:
        ipv4_address: 10.10.30.11

  ehr:
    build: ./ehr
    depends_on:
      - ehr-app
    networks:
      server:
        ipv4_address: 10.10.30.10
    volumes:
      - ehr-logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://10.10.30.10/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks:
      management:
        ipv4_address: 10.10.99.20
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki
    networks:
      management:
        ipv4_address: 10.10.99.21
    volumes:
      - ./monitoring/promtail:/etc/promtail:ro
      - suricata-logs:/var/log/suricata:ro
      - gateway-logs:/var/log/gateway:ro
      - ehr-logs:/var/log/ehr:ro

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - loki
    networks:
      management:
        ipv4_address: 10.10.99.22
      ui:
        ipv4_address: 10.10.100.22
    ports:
      - "3000:3000"
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  test:
    image: python:3.12-alpine
    working_dir: /workspace
    volumes:
      - ./tests:/workspace/tests:ro
    command: ["python", "-m", "pytest", "-q"]
    profiles: ["test"]

networks:
  staff:
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 10.10.10.0/24
  guest:
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 10.10.20.0/24
  server:
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 10.10.30.0/24
  management:
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 10.10.99.0/24
  attacker:
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 10.10.66.0/24
  ui:
    ipam:
      config:
        - subnet: 10.10.100.0/24

volumes:
  suricata-logs:
  gateway-logs:
  ehr-logs:
  loki-data:
  grafana-data:
