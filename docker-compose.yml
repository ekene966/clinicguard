name: clinicguard

services:
  gateway:
    build: ./gateway
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      staff:
        ipv4_address: 10.10.10.254
      guest:
        ipv4_address: 10.10.20.254
      server:
        ipv4_address: 10.10.30.254
      management:
        ipv4_address: 10.10.99.254
      attacker:
        ipv4_address: 10.10.66.254

  suricata:
    image: jasonish/suricata:7.0
    network_mode: service:gateway
    depends_on:
      - gateway
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - suricata
      - -i
      - eth0
      - -S
      - /rules/local.rules
      - -l
      - /var/log/suricata
    volumes:
      - ./monitoring/suricata:/rules:ro
      - suricata-logs:/var/log/suricata

  staff-client:
    build: ./clients
    cap_add:
      - NET_ADMIN
    command: ["staff"]
    networks:
      staff:
        ipv4_address: 10.10.10.10

  guest-client:
    build: ./clients
    cap_add:
      - NET_ADMIN
    command: ["guest"]
    networks:
      guest:
        ipv4_address: 10.10.20.10

  attacker:
    build: ./clients
    cap_add:
      - NET_ADMIN
    command: ["attacker"]
    networks:
      attacker:
        ipv4_address: 10.10.66.10

  ehr-app:
    build: ./clients
    cap_add:
      - NET_ADMIN
    command: ["server"]
    networks:
      server:
        ipv4_address: 10.10.30.11

  ehr:
    build: ./ehr
    depends_on:
      - ehr-app
    networks:
      server:
        ipv4_address: 10.10.30.10

  test:
    image: python:3.12-alpine
    working_dir: /workspace
    volumes:
      - ./tests:/workspace/tests:ro
    command: ["python", "-m", "pytest", "-q"]
    profiles: ["test"]

networks:
  staff:
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 10.10.10.0/24
  guest:
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 10.10.20.0/24
  server:
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 10.10.30.0/24
  management:
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 10.10.99.0/24
  attacker:
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 10.10.66.0/24

volumes:
  suricata-logs:
