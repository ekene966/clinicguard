server {
    listen 443 ssl;
    server_name clinicguard-ehr;

    ssl_certificate /etc/nginx/certs/ehr.crt;
    ssl_certificate_key /etc/nginx/certs/ehr.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://10.10.30.11:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
