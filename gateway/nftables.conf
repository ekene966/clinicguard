flush ruleset
table inet clinicguard {
  chain forward {
    type filter hook forward priority filter;
    policy drop;

    ct state established,related accept
    ip saddr 10.10.10.0/24 ip daddr 10.10.30.10 tcp dport 8080 accept
    ip saddr 10.10.10.0/24 tcp dport { 53, 80, 443 } accept
    ip saddr 10.10.20.0/24 tcp dport { 53, 80, 443 } accept
    ip saddr 10.10.20.0/24 udp dport 53 accept
    ip saddr 10.10.10.0/24 udp dport 53 accept
  }
}
