flush ruleset
table inet clinicguard {
  chain forward {
    type filter hook forward priority filter;
    policy drop;

    ct state established,related accept
    limit rate 5/second burst 10 packets log prefix "clinicguard forward drop: " drop
  }

  chain input {
    type filter hook input priority filter;
    policy drop;

    iifname "lo" accept
    ct state established,related accept
    ip saddr 10.10.10.0/24 tcp dport 443 accept
    limit rate 5/second burst 10 packets log prefix "clinicguard input drop: " drop
  }
}
