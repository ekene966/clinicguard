server {
    listen 10.10.10.254:443 ssl;
    server_name clinicguard-ehr;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    ssl_certificate /etc/nginx/certs/ehr.crt;
    ssl_certificate_key /etc/nginx/certs/ehr.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass https://10.10.30.10:443;
        proxy_ssl_verify off;
        proxy_set_header Host clinicguard-ehr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
